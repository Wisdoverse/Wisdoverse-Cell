    "shared/control_plane/bootstrap_ports.py",
    "shared/control_plane/budget_guard_ports.py",
    "shared/control_plane/budget_ports.py",
    "shared/control_plane/company_ports.py",
    "shared/control_plane/decision_ports.py",
    "shared/control_plane/evolution_proposal_ports.py",
    "shared/control_plane/goal_ports.py",
    "shared/control_plane/prompt_config_ports.py",
    "shared/control_plane/run_evidence_ports.py",
    "shared/control_plane/runtime_plugin_ports.py",
    "shared/control_plane/work_item_ports.py",
    # Support-capability ports (sync, analysis, evolution).
    "shared/capabilities/analysis/core/health_ports.py",
    "shared/capabilities/analysis/core/outbox_ports.py",
    "shared/capabilities/evolution/core/analysis_ports.py",
    "shared/capabilities/evolution/core/control_plane_ports.py",
    "shared/capabilities/evolution/core/health_ports.py",
