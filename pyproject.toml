    # User-interaction gateway ports are excluded for now because the
    # package __init__.py walks chat_ports.py and chat_ports has
    # 5 missing annotations. Re-include after typing chat_ports.
    "services/gateways/channel/core/outbox_ports.py",
    "services/orchestration/coordinator/core/health_ports.py",
    "services/orchestration/coordinator/core/outbox_ports.py",
    "services/orchestration/coordinator/core/state_ports.py",
]
# Pure ports / protocols / value-object helpers. No SQLAlchemy, no
# FastAPI, no async LiteLLM clients in scope yet. `follow_imports =
# silent` prevents cascading errors from transitive untyped modules.
follow_imports = "silent"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
