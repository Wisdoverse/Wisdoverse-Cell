name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  public-hygiene:
    name: Public hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Block stale private/public-release references
        run: |
          if [ -f .gitlab-ci.yml ]; then
            echo ".gitlab-ci.yml must not be published on the GitHub public branch"
            exit 1
          fi
          tracked_env_files="$(git ls-files '.env*' | grep -v '^.env.example$' || true)"
          if [ -n "$tracked_env_files" ]; then
            echo "Only .env.example may be tracked on the GitHub public branch"
            echo "$tracked_env_files"
            exit 1
          fi
          if git grep -n -I -E 'Project Cell|projectcell|project_cell|project-cell|project-cell-prd\.md|security@projectcell\.ai|wiki\.projectcell\.ai|itoy\.dev|itoy\.ai|cell\.wisdoverse\.com|--insecure-skip-tls-verify' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "Found stale pre-rebrand identifiers, internal hostnames, or banned flags on the public branch"
            exit 1
          fi

  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check agents/ shared/ tests/ scripts/ migrations/
      - name: Mypy (scoped per pyproject.toml)
        run: make typecheck
      - name: Python dependency audit
        run: make python-dependency-audit
      - name: Python tests
        run: make test-public
      - name: Roadmap runtime and evidence tests
        run: make test-roadmap

  migrations:
    name: Migration round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wisdoverse_cell
          POSTGRES_PASSWORD: wisdoverse_cell
          POSTGRES_DB: wisdoverse_cell_migration_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wisdoverse_cell"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: PostgreSQL execution concurrency must run
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://wisdoverse_cell:wisdoverse_cell@127.0.0.1:5433/wisdoverse_cell_migration_test
        run: |
          python -m pytest -q tests/control_plane/test_execution_governance.py shared/evolution/tests/test_skill_release_postgres.py -k postgres --junitxml=/tmp/execution-concurrency.xml
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse('/tmp/execution-concurrency.xml').findall('.//testcase')
          if len(cases) != 7 or any(case.find('skipped') is not None for case in cases):
              sys.exit('PostgreSQL execution concurrency test was skipped or not collected')
          if any(case.find('failure') is not None or case.find('error') is not None for case in cases):
              sys.exit('PostgreSQL execution concurrency test failed')
          PY
      - name: Native PostgreSQL receiver ownership must run
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://wisdoverse_cell:wisdoverse_cell@127.0.0.1:5433/wisdoverse_cell_migration_test
        run: |
          python -m pytest -q tests/integration/test_native_executor_postgres.py --junitxml=/tmp/native-executor-concurrency.xml
          python - <<'PYTEST_GATE'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse('/tmp/native-executor-concurrency.xml').findall('.//testcase')
          if len(cases) != 8 or any(case.find('skipped') is not None for case in cases):
              sys.exit('Native PostgreSQL receiver tests were skipped or not collected')
          if any(case.find('failure') is not None or case.find('error') is not None for case in cases):
              sys.exit('Native PostgreSQL receiver ownership failed')
          PYTEST_GATE
      - name: Roadmap PostgreSQL acceptance must run
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://wisdoverse_cell:wisdoverse_cell@127.0.0.1:5433/wisdoverse_cell_migration_test
        run: |
          python -m pytest -q tests/integration/test_company_reuse_acceptance.py tests/integration/test_evolution_loop_acceptance.py tests/integration/test_recurring_work_acceptance.py tests/integration/test_physical_retention.py tests/integration/test_requirement_delivery_handoff.py --junitxml=/tmp/roadmap-acceptance.xml
          python - <<'PYTEST_GATE'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse('/tmp/roadmap-acceptance.xml').findall('.//testcase')
          if len(cases) != 12 or any(case.find('skipped') is not None for case in cases):
              sys.exit('Roadmap PostgreSQL acceptance was skipped or not collected')
          if any(case.find('failure') is not None or case.find('error') is not None for case in cases):
              sys.exit('Roadmap PostgreSQL acceptance failed')
          PYTEST_GATE
      - name: Migration round-trip
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://wisdoverse_cell:wisdoverse_cell@127.0.0.1:5433/wisdoverse_cell_migration_test
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5433"
          POSTGRES_USER: wisdoverse_cell
          POSTGRES_PASSWORD: wisdoverse_cell
          POSTGRES_DB: wisdoverse_cell_migration_test
          CONTROL_PLANE_ENABLED: "true"
        run: make migration-test
      - name: Dev candidate migration rehearsal
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://wisdoverse_cell:wisdoverse_cell@127.0.0.1:5433/wisdoverse_cell_migration_test
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: make migration-rehearse-dev
      - name: Dev migration failure and isolation contracts
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://wisdoverse_cell:wisdoverse_cell@127.0.0.1:5433/wisdoverse_cell_migration_test
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m pytest -q tests/unit/test_dev_migration_rehearsal.py tests/integration/test_dev_migration_rehearsal.py
      - name: Upload sanitized migration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s41-dev-migration-evidence
          path: .artifacts/s41-dev-postgresql.json
          if-no-files-found: error
          retention-days: 14

  rust-gateway:
    name: Rust gateway tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust toolchain
        run: rustup install --no-self-update
      - name: Rust format
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --locked
      - name: Rust clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Rust gateway build
        run: cargo build --manifest-path rust/Cargo.toml --locked -p wisdoverse-cell-rust-gateway
      - name: Rust gateway Docker build
        run: docker build -f rust/gateway/Dockerfile -t wisdoverse/cell-rust-gateway:ci .

  agents-image:
    name: Agents image smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build unified agents image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.agents
          push: false
          tags: wisdoverse/cell-agents:ci
          cache-from: type=gha,scope=cell-agents-ci
          cache-to: type=gha,scope=cell-agents-ci,mode=max

  frontend:
    name: Frontend lint, tests, audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: browser_acceptance
          POSTGRES_PASSWORD: synthetic_browser_acceptance
          POSTGRES_DB: browser_acceptance
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U browser_acceptance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install browser acceptance dependencies
        run: |
          pip install -r ../requirements.txt
          npx playwright install --with-deps chromium
      - name: Mocked workflow browser contracts
        run: npm run test:e2e -- e2e/control-plane-workflow.spec.ts --reporter=line
      - name: Real PostgreSQL operator browser acceptance
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://browser_acceptance:synthetic_browser_acceptance@127.0.0.1:5434/browser_acceptance
          CONTROL_PLANE_API_BASE_URL: http://127.0.0.1:8101/api/v1
          CONTROL_PLANE_OPERATOR_TOKEN: synthetic-browser-operator
          CONTROL_PLANE_INTERNAL_KEY: synthetic-browser-internal
          AUTH_SECRET: synthetic-browser-auth-secret
          NEXTAUTH_URL: http://localhost:3200
          REAL_CONTROL_PLANE_E2E: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3200
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: /tmp/roadmap-browser.xml
        run: |
          PYTHONPATH=.. python ../scripts/roadmap_acceptance_server.py > /tmp/roadmap-browser-api.log 2>&1 &
          api_pid=$!
          npm run dev -- --hostname localhost --port 3200 > /tmp/roadmap-browser-next.log 2>&1 &
          next_pid=$!
          trap 'kill -INT "$api_pid"; kill "$next_pid"; wait "$api_pid" || true; wait "$next_pid" || true' EXIT
          python - <<'PYTEST_READY'
          import time
          import urllib.request

          for url in ('http://127.0.0.1:8101/health', 'http://localhost:3200'):
              for attempt in range(60):
                  try:
                      with urllib.request.urlopen(url, timeout=1) as response:
                          if response.status == 200:
                              break
                  except (OSError, TimeoutError):
                      time.sleep(1)
              else:
                  raise SystemExit(f'Browser acceptance fixture unavailable: {url}')
          PYTEST_READY
          npm run test:e2e -- e2e/control-plane-real-api.spec.ts --reporter=line,junit
          python - <<'PYTEST_GATE'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse('/tmp/roadmap-browser.xml').findall('.//testcase')
          if len(cases) != 1 or any(case.find('skipped') is not None for case in cases):
              sys.exit('Real operator browser acceptance was skipped or not collected')
          if any(case.find('failure') is not None or case.find('error') is not None for case in cases):
              sys.exit('Real operator browser acceptance failed')
          PYTEST_GATE
